openapi: 3.0.3
info:
  title: Resttek API
  version: 1.0.0
  description: |
    API REST del backend de Resttek para la gestión de restaurantes, carta, ingredientes,
    empleados y pedidos.

    **Autenticación:** los endpoints protegidos requieren una cabecera
    `Authorization: Bearer <token>` con el JWT obtenido en `/auth/login` o `/auth/register`.

    **Roles:** `admin`, `manager`, `camarero`, `cocinero`, `cliente`.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
tags:
  - name: Auth
    description: Inicio de sesión y registro de clientes
  - name: Employees
    description: Gestión de empleados
  - name: Restaurants
    description: Gestión de restaurantes
  - name: Ingredients
    description: Ingredientes (inventario) de un restaurante
  - name: Dishes
    description: Platos de la carta de un restaurante
  - name: Orders
    description: Pedidos y estado de sus ítems
  - name: Tables
    description: Mesas de un restaurante (CRUD, estado y pedidos por mesa)
  - name: Public
    description: Endpoints sin autenticación para clientes
  - name: Health
    description: Estado del servicio
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas (`InvalidCredentialsError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un cliente
      description: Crea un usuario con rol `cliente` y devuelve su token.
      operationId: registerClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos inválidos o email ya en uso (`DuplicatedEmailError`, `InvalidEmailError`...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /employees:
    post:
      tags: [Employees]
      summary: Crear un empleado
      description: Requiere rol `admin`.
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Employees]
      summary: Listar empleados
      description: Requiere rol `admin`. Paginación por `limit`/`offset`.
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: role
          in: query
          description: Filtra por rol
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Lista de empleados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /employees/{id}:
    get:
      tags: [Employees]
      summary: Obtener un empleado
      description: Requiere rol `admin`.
      operationId: getEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Empleado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants:
    post:
      tags: [Restaurants]
      summary: Crear un restaurante
      description: Requiere rol `admin`.
      operationId: createRestaurant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Restaurants]
      summary: Listar restaurantes
      description: |
        Un `admin` recibe todos los restaurantes; el resto de roles recibe únicamente
        el restaurante al que pertenecen (o una lista vacía si no tienen ninguno).
      operationId: listRestaurants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /restaurants/{id}:
    get:
      tags: [Restaurants]
      summary: Obtener un restaurante
      operationId: getRestaurant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Restaurants]
      summary: Actualizar un restaurante
      description: Requiere rol `admin`.
      operationId: updateRestaurant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurante actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{restaurantId}/employees:
    get:
      tags: [Employees]
      summary: Listar empleados de un restaurante
      description: Requiere rol `admin`.
      operationId: listRestaurantEmployees
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Empleados del restaurante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{restaurantId}/ingredients:
    post:
      tags: [Ingredients]
      summary: Crear un ingrediente
      description: Requiere rol `admin`.
      operationId: createIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '201':
          description: Ingrediente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Ingredients]
      summary: Listar ingredientes de un restaurante
      description: Requiere rol `admin`, `manager` o `cocinero`.
      operationId: listIngredients
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Lista de ingredientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{restaurantId}/ingredients/{id}:
    get:
      tags: [Ingredients]
      summary: Obtener un ingrediente
      description: Requiere rol `admin`, `manager` o `cocinero`.
      operationId: getIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingrediente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ingredients]
      summary: Actualizar un ingrediente
      description: Requiere rol `admin`.
      operationId: updateIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '200':
          description: Ingrediente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Ingredients]
      summary: Eliminar un ingrediente
      description: Requiere rol `admin`.
      operationId: deleteIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Ingrediente eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{restaurantId}/dishes:
    post:
      tags: [Dishes]
      summary: Crear un plato
      description: Requiere rol `admin` o `manager`.
      operationId: createDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishInput'
      responses:
        '201':
          description: Plato creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Dishes]
      summary: Listar platos de un restaurante
      description: Requiere rol `admin`, `manager`, `camarero` o `cocinero`. Incluye platos no disponibles.
      operationId: listDishes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Lista de platos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{restaurantId}/dishes/{id}:
    get:
      tags: [Dishes]
      summary: Obtener un plato
      description: Requiere rol `admin`, `manager`, `camarero` o `cocinero`.
      operationId: getDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Plato encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Dishes]
      summary: Actualizar un plato
      description: Requiere rol `admin` o `manager`.
      operationId: updateDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishInput'
      responses:
        '200':
          description: Plato actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Dishes]
      summary: Eliminar un plato
      description: Requiere rol `admin` o `manager`.
      operationId: deleteDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Plato eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/restaurants:
    get:
      tags: [Public]
      summary: Listar todos los restaurantes (público)
      operationId: listPublicRestaurants
      security: []
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
  /public/restaurants/{id}:
    get:
      tags: [Public]
      summary: Obtener un restaurante (público)
      operationId: getPublicRestaurant
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/restaurants/{restaurantId}/dishes:
    get:
      tags: [Public]
      summary: Listar la carta disponible de un restaurante (público)
      description: Devuelve solo los platos con `available = true`.
      operationId: listPublicDishes
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Platos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
  /orders:
    post:
      tags: [Orders]
      summary: Crear un pedido
      description: |
        Cualquier usuario autenticado. El `clientId` se toma del token. Cada ítem con
        `quantity = n` se expande en `n` ítems de cantidad 1 con estado `pendiente`.

        `tableId` es opcional. Si se envía, debe ser una mesa del restaurante con `status = ocupada`
        (si no, 400 `TableNotOccupiedError` o 404 `TableNotFoundError`).
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Datos inválidos o mesa no ocupada (`TableNotOccupiedError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La mesa no existe o no es del restaurante (`TableNotFoundError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/active:
    get:
      tags: [Orders]
      summary: Listar pedidos activos de un restaurante
      operationId: listActiveOrders
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedidos activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Falta `restaurantId` (`RestaurantIdQueryRequiredError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/mine:
    get:
      tags: [Orders]
      summary: Listar los pedidos del usuario autenticado
      operationId: listMyOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedidos del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener un pedido
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado (`OrderNotFoundError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}/items/{itemId}/status:
    patch:
      tags: [Orders]
      summary: Cambiar el estado de un ítem de un pedido
      operationId: updateOrderItemStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '204':
          description: Estado actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido o ítem no encontrado (`OrderNotFoundError`, `OrderItemNotFoundError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Tables]
      summary: Listar mesas del restaurante
      description: |
        Roles `admin`, `manager`, `camarero`, `cocinero`. Ordenadas por `number` ascendente.
        Sin paginación (devuelve un array).
      operationId: listTables
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por `status`.
          schema:
            $ref: '#/components/schemas/TableStatus'
      responses:
        '200':
          description: Mesas del restaurante
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Table' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tables]
      summary: Crear una mesa
      description: Roles `admin`, `manager`. Si no se indica `status`, nace `libre`. `number` es único por restaurante.
      operationId: createTable
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTableRequest' }
      responses:
        '201':
          description: Mesa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '400':
          description: Datos inválidos (`InvalidTableNumberError`, `InvalidTableCapacityError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DuplicatedNumber' }
  /restaurants/{restaurantId}/tables/orders:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Tables]
      summary: Pedidos activos de las mesas ocupadas
      description: |
        Roles `admin`, `manager`, `camarero`, `cocinero`. Devuelve una entrada por cada mesa
        con `status = ocupada`, con sus pedidos (`tableId` = id de la mesa) e ítems con su estado.
        Solo pedidos activos (mismo criterio que `GET /orders/active`). Una mesa ocupada sin pedidos devuelve `orders: []`. Ordenado por `table.number`.
      operationId: listOccupiedTablesOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mesas ocupadas con sus pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TableOrders' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /restaurants/{restaurantId}/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tables]
      summary: Obtener una mesa
      description: Roles `admin`, `manager`, `camarero`, `cocinero`.
      operationId: getTable
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mesa encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TableNotFound' }
    put:
      tags: [Tables]
      summary: Actualizar una mesa
      description: |
        Roles `admin`, `manager`. Reemplaza `number`, `description` y `capacity`;
        `status` es opcional (si se omite se mantiene). El personal puede cambiarlo también con `/status`.
      operationId: updateTable
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTableRequest' }
      responses:
        '200':
          description: Mesa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '400':
          description: Datos inválidos (`InvalidTableNumberError`, `InvalidTableCapacityError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TableNotFound' }
        '409': { $ref: '#/components/responses/DuplicatedNumber' }
    delete:
      tags: [Tables]
      summary: Eliminar una mesa
      description: Roles `admin`, `manager`. No se puede borrar una mesa `ocupada`.
      operationId: deleteTable
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Mesa eliminada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TableNotFound' }
        '409':
          description: Mesa ocupada (`TableOccupiedError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: TableOccupiedError
                message: No se puede eliminar una mesa ocupada
  /restaurants/{restaurantId}/tables/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Tables]
      summary: Cambiar el estado de una mesa
      description: |
        Roles `admin`, `manager`, `camarero`. Cualquier transición entre `libre`, `ocupada`
        y `reservada` es válida (el personal tiene la última palabra). Es idempotente si el
        estado no cambia.
      operationId: updateTableStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTableStatusRequest' }
      responses:
        '200':
          description: Mesa con el nuevo estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '400':
          description: Estado inválido (`InvalidTableStatusError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: InvalidTableStatusError
                message: El estado de la mesa debe ser libre, ocupada o reservada
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TableNotFound' }
  /public/restaurants/{restaurantId}/tables/available:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Public]
      summary: Mesas disponibles para un número de personas
      description: |
        Mesas con `status = libre` y `capacity >= people`, ordenadas por `capacity` ascendente
        y luego por `number`. Array vacío si no hay ninguna.
      operationId: listAvailableTables
      security: []
      parameters:
        - name: people
          in: query
          required: true
          description: Número de personas (entero >= 1).
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Mesas disponibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Table' }
        '400':
          description: Falta `people` o no es un entero >= 1 (`InvalidGuestsError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: InvalidGuestsError
                message: El número de personas debe ser un entero mayor que 0
        '404': { $ref: '#/components/responses/NotFound' }
  /public/restaurants/{restaurantId}/tables/{id}/occupy:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Public]
      summary: Ocupar una mesa
      description: |
        Pasa la mesa de `libre` a `ocupada` de forma atómica y devuelve la mesa actualizada.
        Si dos clientes compiten por la misma mesa, solo uno recibe 200 y el otro 409.
        Una mesa `reservada` tampoco se puede ocupar por esta vía (409).
      operationId: occupyTable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OccupyTableRequest' }
      responses:
        '200':
          description: Mesa ocupada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '400':
          description: |
            Datos inválidos o capacidad insuficiente (`InvalidGuestsError`, `InsufficientTableCapacityError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: InsufficientTableCapacityError
                message: La mesa no tiene capacidad suficiente para el número de personas
        '404': { $ref: '#/components/responses/TableNotFound' }
        '409':
          description: La mesa no está libre (`TableAlreadyOccupiedError`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: TableAlreadyOccupiedError
                message: La mesa ya está ocupada
  /health:
    get:
      tags: [Health]
      summary: Comprobar el estado del servicio
      description: Está en la raíz del servidor, fuera del prefijo `/api/v1`.
      operationId: getHealth
      security: []
      servers:
        - url: http://localhost:3000
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Servicio no disponible
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Datos inválidos (errores de dominio)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, malformado o inválido (`MissingTokenError`, `MalformedTokenError`, `InvalidTokenError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del usuario no tiene permisos (`InsufficientPermissionsError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TableNotFound:
      description: Mesa o restaurante no encontrado (`TableNotFoundError`, `RestaurantNotFoundError`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: TableNotFoundError
            message: Mesa no encontrada
    DuplicatedNumber:
      description: Ya existe una mesa con ese número en el restaurante (`DuplicatedTableNumberError`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: DuplicatedTableNumberError
            message: Ya existe una mesa con ese número en el restaurante
  schemas:
    Error:
      type: object
      description: |
        Formato único de error en toda la API, generado por el `errorHandler`.
        `error` es el nombre del error de dominio y `message` un texto en español.
      properties:
        error:
          type: string
          example: RestaurantNotFoundError
        message:
          type: string
          example: Restaurante no encontrado
    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
    OrderStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
    Table:
      type: object
      required: [id, restaurantId, number, description, capacity, status]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        number:
          type: integer
          minimum: 1
          description: Número de mesa, único por restaurante.
          example: 7
        description:
          type: string
          nullable: true
          description: Texto libre (p. ej. "Terraza"); puede ser null.
          example: Terraza junto a la ventana
        capacity: { type: integer, minimum: 1, example: 4 }
        status: { $ref: '#/components/schemas/TableStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTableRequest:
      type: object
      required: [number, capacity]
      properties:
        number: { type: integer, minimum: 1 }
        description: { type: string, nullable: true, maxLength: 200 }
        capacity: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TableStatus' }
    UpdateTableRequest:
      type: object
      required: [number, capacity]
      properties:
        number: { type: integer, minimum: 1 }
        description: { type: string, nullable: true, maxLength: 200 }
        capacity: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TableStatus' }
    UpdateTableStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/TableStatus' }
    OccupyTableRequest:
      type: object
      required: [people]
      properties:
        people:
          type: integer
          minimum: 1
          description: Número de personas; debe ser <= `capacity` de la mesa.
    TableOrders:
      type: object
      required: [table, orders]
      properties:
        table: { $ref: '#/components/schemas/Table' }
        orders:
          type: array
          description: Pedidos con `tableId` = `table.id` (esquema `Order`).
          items: { $ref: '#/components/schemas/Order' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT con `id`, `role` y `restaurantId`
        employee:
          $ref: '#/components/schemas/Employee'
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          format: uuid
          nullable: true
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          format: uuid
          nullable: true
    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
    Restaurant:
      allOf:
        - $ref: '#/components/schemas/RestaurantInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
    IngredientInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          default: 0
    Ingredient:
      allOf:
        - $ref: '#/components/schemas/IngredientInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            restaurantId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
    DishInput:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          default: true
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
    Dish:
      allOf:
        - $ref: '#/components/schemas/DishInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            restaurantId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CreateOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
              notes:
                type: string
                nullable: true
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dishId:
          type: string
          format: uuid
        quantity:
          type: integer
          example: 1
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        dishName:
          type: string
        dishPrice:
          type: number
        dishCategory:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: string
          nullable: true
        tableNumber:
          type: integer
          nullable: true
          description: Número de la mesa asociada (`null` si el pedido no tiene mesa)
        clientId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: string
        restaurantLogoUrl:
          type: string
          nullable: true
